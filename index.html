<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>五代十国 · 群雄自决</title>
<style>
:root{--bg:#0d1015;--panel:#171b23;--panel2:#202632;--line:#303846;--text:#e8e2d5;--muted:#9da5b3;--gold:#d7ad62;--red:#b95f55;--green:#6fa77b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#20232b 0,#0d1015 55%);color:var(--text);font-family:system-ui,"Microsoft YaHei",sans-serif}
header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#101319dd;position:sticky;top:0;z-index:2}
h1{font-family:serif;margin:0;font-size:25px;letter-spacing:3px}.sub{color:var(--muted);font-size:13px;margin-top:5px}
button{border:1px solid #5b4a2c;background:#282217;color:#e8d4aa;padding:9px 14px;border-radius:7px;cursor:pointer}button:hover{background:#3a301f}
main{max-width:1250px;margin:22px auto;padding:0 18px}.grid{display:grid;grid-template-columns:1.15fr 1.6fr 1fr;gap:16px}
.panel{background:linear-gradient(145deg,#181c24,#12151b);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 12px 30px #0005}.panel h2{font-size:15px;color:var(--gold);margin:0 0 13px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:var(--panel2);padding:11px;border-radius:8px}.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--muted)}
#npcs{display:grid;gap:8px;max-height:520px;overflow:auto}.npc{padding:11px;background:#1d222b;border:1px solid #2c3340;border-radius:8px;cursor:pointer}.npc.active{border-color:var(--gold);box-shadow:0 0 0 1px #d7ad6233}.npc-top{display:flex;justify-content:space-between}.tag{font-size:11px;color:#c8b38a}.meter{height:5px;background:#0c0f13;border-radius:5px;margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--gold)}
#log{height:390px;overflow:auto;display:flex;flex-direction:column;gap:9px}.event{border-left:2px solid #6c5937;padding:7px 10px;background:#151920}.turn{font-size:11px;color:var(--gold)}.event p{margin:4px 0;font-size:13px;line-height:1.55}
.detail{min-height:390px}.big{font-family:serif;font-size:23px;margin-bottom:4px}.quote{color:#c8c1b5;font-style:italic;line-height:1.6;margin:15px 0}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.notice{margin-bottom:15px;padding:11px 14px;border:1px solid #403824;background:#17150f;color:#d9c49a;border-radius:8px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.detail{min-height:0}}
</style>
</head>
<body>
<header><div><h1>五代十国 · 群雄自决</h1><div class="sub">洛阳之外，天下并不等你下令。</div></div><div><button onclick="saveGame()">保存</button> <button onclick="loadGame()">读取</button> <button onclick="nextTurn()">推进一回合</button></div></header>
<main>
<div class="notice">实验规则：你是赵匡胤。其他人物会根据自己的性格、关系、利益与恐惧自行行动。你只能影响他们，不能完全控制他们。</div>
<div class="grid">
<section class="panel"><h2>天下局势</h2><div class="stats" id="world"></div><h2 style="margin-top:18px">势力网络</h2><div id="factions"></div><h2 style="margin-top:18px">城池与军队</h2><div id="cities"></div><h2 style="margin-top:18px">战场态势</h2><div id="battles"></div><h2 style="margin-top:18px">权力危机</h2><div id="crisis"></div><h2 style="margin-top:18px">事件链</h2><div id="chains"></div><h2 style="margin-top:18px">人物</h2><div id="npcs"></div></section>
<section class="panel"><h2>天下纪事</h2><div id="log"></div></section>
<section class="panel detail" id="detail"></section>
</div>
</main>
<script>
const npcs=[
{id:"guo",name:"郭威",faction:"后周",role:"天子",personality:"沉稳、果断、疑心重",traits:{ambition:72,loyalty:76,greed:32,courage:82,caution:65},goal:"稳住新朝，防止藩镇坐大",trust:55,quote:"朕不怕兵少，只怕人心先散。"},
{id:"shi",name:"史弘肇",faction:"后周",role:"宿将",personality:"强硬、重军功、少耐心",traits:{ambition:64,loyalty:71,greed:40,courage:91,caution:28},goal:"扩军立功，压住潜在的叛乱",trust:61,quote:"军中说话，不靠漂亮话。"},
{id:"wang",name:"王朴",faction:"后周",role:"谋臣",personality:"理性、谨慎、长远",traits:{ambition:48,loyalty:84,greed:22,courage:53,caution:88},goal:"积蓄国力，等待统一机会",trust:67,quote:"天下不是一场仗打下来的。"},
{id:"han",name:"韩通",faction:"后周",role:"将领",personality:"忠直、骄傲、好胜",traits:{ambition:58,loyalty:79,greed:28,courage:86,caution:35},goal:"证明自己不逊于任何宿将",trust:49,quote:"若要退，我韩通宁可死在阵前。"},
{id:"li",name:"李重进",faction:"后周",role:"禁军将领",personality:"骄傲、多疑、现实",traits:{ambition:79,loyalty:43,greed:51,courage:80,caution:61},goal:"扩大自己的军中势力",trust:39,quote:"功劳是我的，为什么位置不是？"},
{id:"zhao",name:"赵匡胤",faction:"后周",role:"殿前都点检",personality:"克制、善察人心、野心深藏",traits:{ambition:88,loyalty:63,greed:36,courage:85,caution:72},goal:"积累军心与威望，等待真正的机会",trust:100,quote:"现在还不是时候。"},
{id:"liu",name:"刘承祐",faction:"后汉",role:"旧部势力",personality:"急躁、敏感、缺乏安全感",traits:{ambition:70,loyalty:52,greed:44,courage:48,caution:39},goal:"保住自己的势力与性命",trust:27,quote:"别人都在等我倒下。"},
{id:"nan",name:"南唐使者",faction:"南唐",role:"使者",personality:"圆滑、谨慎、机会主义",traits:{ambition:61,loyalty:58,greed:67,courage:31,caution:91},goal:"探清后周底线，争取喘息时间",trust:35,quote:"刀兵之外，总还有一条路。"}
];
let selected="zhao",turn=1,day=1,chronicle=[];
let cities=[
 {id:"kaifeng",name:"开封",owner:"后周",grain:72,garrison:38,commander:"郭威",roads:["luoyang","jinyang"]},
 {id:"luoyang",name:"洛阳",owner:"后周",grain:55,garrison:28,commander:"韩通",roads:["kaifeng","jiangling"]},
 {id:"jinling",name:"金陵",owner:"南唐",grain:80,garrison:34,commander:"南唐使者",roads:["jiangling"]},
 {id:"jiangling",name:"江陵",owner:"南唐",grain:46,garrison:22,commander:"南唐使者",roads:["luoyang","jinling"]},
 {id:"jinyang",name:"晋阳",owner:"后汉残余",grain:61,garrison:31,commander:"刘承祐",roads:["kaifeng"]}
];
let battles=[];
let mutinyRisk=18;
let eventChains=[];
function pushChain(title,steps){
 eventChains.unshift({title,steps:steps.slice(0,5),turn});
 eventChains=eventChains.slice(0,8);
}
function chainTurn(){
 const z=findNpc("赵匡胤"),li=findNpc("李重进"),han=findNpc("韩通"),wang=findNpc("王朴");
 if(!z)return;
 if(li&&relation(li,z)<-35&&li.traits.ambition>70&&Math.random()<.18){
   changeRelation(li,han,-6);
   if(han)changeRelation(han,z,2);
   pushChain("李重进开始寻找军中盟友",["李重进对赵匡胤的不满加深","他试探韩通的态度","韩通没有完全倒向李重进","两人的关系因此出现裂痕"]);
   addLog("【事件链】李重进开始寻找军中盟友，但韩通没有立即响应。");
 }
 if(wang&&world.grain<30&&Math.random()<.22){
   world.tension=Math.min(100,world.tension+3);
   changeRelation(wang,z,3);
   pushChain("粮道危机引发朝堂争论",["王朴发现粮草持续下降","他建议暂缓军事行动","赵匡胤获得一次政治机会","朝廷内部开始讨论军粮优先级"]);
   addLog("【事件链】粮道危机进入朝堂，王朴开始推动稳粮策略。");
 }
 if(z.traits.ambition>80&&mutinyRisk>55&&Math.random()<.12){
   pushChain("禁军内部出现异常传闻",["赵匡胤军中威望上升","禁军开始传播模糊流言","部分将领观察赵匡胤的态度","陈桥风险进入敏感阶段"]);
   addLog("【事件链】禁军内部出现异常传闻，局势开始变得微妙。");
 }
}
function renderChains(){
 $("chains").innerHTML=eventChains.length?eventChains.map(e=>`<div class="npc"><div class="npc-top"><strong>第${e.turn}回合 · ${e.title}</strong></div>${e.steps.map((s,i)=>`<div class="tag">${i+1}. ${s}</div>`).join("")}</div>`).join(""):'<div class="tag">暂无持续事件。</div>';
}
function updatePoliticalAfterBattle(){
 const z=findNpc("赵匡胤"),li=findNpc("李重进"),han=findNpc("韩通");
 if(!z)return;
 const army=armies.find(a=>a.commander==="赵匡胤");
 const guardPower=factions.guards.power;
 mutinyRisk=Math.max(0,Math.min(100,Math.round(
  12+(army?(100-army.morale)*.35:0)+(100-z.traits.loyalty)*.18+
  (guardPower>65?(guardPower-65)*.55:0)+(li?.traits.ambition||0)*.12+
  (li&&relation(li,z)<0?Math.abs(relation(li,z))*.18:0)+world.tension*.16
  -(z.traits.caution>65?8:0)
 )));
}
function politicalTurn(){
 updatePoliticalAfterBattle();
 const z=findNpc("赵匡胤"),li=findNpc("李重进");
 if(mutinyRisk>65&&Math.random()<.22){
  world.tension=Math.min(100,world.tension+8);
  if(li)changeRelation(li,z,-8);
  addLog("【权力危机】禁军中开始流传对赵匡胤不利的议论，陈桥兵变风险上升。");
 } else if(mutinyRisk<30&&Math.random()<.18){
  world.prestige=Math.min(100,world.prestige+2);
  addLog("【政治稳定】禁军秩序良好，赵匡胤的军中威望得到巩固。");
 }
}
function renderCrisis(){
 $("crisis").innerHTML=`<div class="npc"><div class="npc-top"><strong>陈桥兵变风险</strong><span class="tag">${mutinyRisk}/100</span></div><div class="meter"><i style="width:${mutinyRisk}%"></i></div><div class="tag">风险来源：禁军势力、赵匡胤军心、李重进态度、天下紧张度、军队士气</div></div>`;
}
function findNpc(name){return npcs.find(n=>n.name===name)}
function armyDecision(a){
 const n=findNpc(a.commander); if(!n)return "驻守";
 const enemies=armies.filter(x=>x.owner!==a.owner&&x.location===a.location);
 if(enemies.length && n.traits.courage>65 && n.traits.caution<60 && a.morale>55 && a.supply>30)return "进攻";
 if(a.supply<28 || a.morale<40)return "撤退";
 if(n.traits.caution>75 && a.supply>45)return "驻守";
 if(n.traits.ambition>70 && Math.random()<.35)return "劫粮";
 if(Math.random()<.25)return "增援";
 return "机动";
}
function resolveBattle(a,b){
 const na=findNpc(a.commander),nb=findNpc(b.commander);
 const ap=a.size*(a.morale/100)*(a.supply/100)*(1+(na?.traits.courage||50)/250);
 const bp=b.size*(b.morale/100)*(b.supply/100)*(1+(nb?.traits.courage||50)/250);
 const winner=ap>=bp?a:b,loser=winner===a?b:a;
 const loss=Math.max(2,Math.round(loser.size*(.12+Math.random()*.12)));
 loser.size=Math.max(5,loser.size-loss);loser.morale=Math.max(0,loser.morale-12);
 winner.morale=Math.max(0,winner.morale-5);winner.supply=Math.max(0,winner.supply-10);
 const wn=findNpc(winner.commander),ln=findNpc(loser.commander);
 if(wn){wn.traits.ambition=Math.min(100,wn.traits.ambition+2);wn.memory=(wn.memory||[]);wn.memory.unshift("第"+turn+"回合：在"+cities.find(c=>c.id===winner.location)?.name+"取胜，军中声望上升。");wn.memory=wn.memory.slice(0,6);}
 if(ln){ln.traits.loyalty=Math.max(0,ln.traits.loyalty-3);ln.memory=(ln.memory||[]);ln.memory.unshift("第"+turn+"回合：战败，开始重新评估盟友与自身处境。");ln.memory=ln.memory.slice(0,6);}
 world.prestige=Math.max(0,Math.min(100,world.prestige+(winner.owner==="后周"?1:-1)));
 battles.unshift({turn,name:a.name+" vs "+b.name,winner:winner.name,detail:"胜负由兵力、士气、粮道与主将性格共同决定"});
 addLog("【战斗】"+winner.name+"击退"+loser.name+"。"+loser.name+"损失约"+loss+"队兵力。");
}
function warTurn(){
 battles=battles.slice(0,6);
 armies.forEach(a=>{
  const action=armyDecision(a);
  const city=cities.find(c=>c.id===a.location);
  if(action==="进攻"){
   const target=armies.find(x=>x!==a&&x.owner!==a.owner&&x.location===a.location);
   if(target)resolveBattle(a,target);
   else addLog("【军令】"+a.commander+"决定在"+city.name+"主动求战，但未找到敌军。");
  } else if(action==="撤退"){
   if(city&&city.roads.length){a.location=city.roads[0];a.supply=Math.min(100,a.supply+6);addLog("【军令】"+a.commander+"因补给/士气不稳，率"+a.name+"撤向"+cities.find(c=>c.id===a.location).name+"。");}
  } else if(action==="劫粮"){
   const enemyCity=cities.find(c=>c.owner!==a.owner&&city&&city.roads.includes(c.id));
   if(enemyCity){enemyCity.grain=Math.max(0,enemyCity.grain-10);a.supply=Math.min(100,a.supply+8);world.tension=Math.min(100,world.tension+6);addLog("【劫粮】"+a.commander+"突袭"+enemyCity.name+"粮仓，敌方粮草下降。");}
  } else if(action==="增援"){
   const target=armies.find(x=>x!==a&&x.owner===a.owner&&city&&x.location!==a.location);
   if(target&&city.roads.includes(target.location)){a.location=target.location;addLog("【增援】"+a.commander+"决定向"+target.name+"靠拢。");}
  } else if(action==="驻守"&&city){city.garrison=Math.min(100,city.garrison+1);}
 });
}
function renderBattles(){
 $("battles").innerHTML=battles.length?battles.map(b=>`<div class="npc"><div class="npc-top"><strong>第${b.turn}回合 · ${b.name}</strong><span class="tag">胜者：${b.winner}</span></div><div class="tag">${b.detail}</div></div>`).join(""):'<div class="tag">目前没有战斗记录。</div>';
}
let armies=[
 {id:"zhaoArmy",name:"殿前军",owner:"后周",size:32,morale:78,supply:70,location:"kaifeng",commander:"赵匡胤"},
 {id:"liArmy",name:"禁军北营",owner:"后周",size:25,morale:67,supply:62,location:"luoyang",commander:"李重进"},
 {id:"liuArmy",name:"晋阳旧军",owner:"后汉残余",size:22,morale:55,supply:58,location:"jinyang",commander:"刘承祐"}
];
let factions={central:{name:"后周中枢",power:72,members:["guo","wang"]},guards:{name:"禁军集团",power:58,members:["zhao","li","han"]},generals:{name:"宿将圈",power:51,members:["shi"]},foreign:{name:"外部势力",power:35,members:["liu","nan"]}};
let world={grain:62,morale:58,prestige:43,tension:51};
const logs=[];
const $=id=>document.getElementById(id);
function score(n){
 const t=n.traits,d=world.tension,me=n.links&&n.links.zhao||0;
 const options=[
  ["扩张军权",t.ambition*.48+t.courage*.22+(100-t.caution)*.18+d*.16+(me<0?12:0)],
  ["谨慎蛰伏",t.caution*.5+t.loyalty*.2+(100-t.ambition)*.18+(100-d)*.12],
  ["谋求私利",t.greed*.5+t.ambition*.25+(100-t.loyalty)*.15+(me<0?10:0)],
  ["主动结盟",t.loyalty*.25+t.caution*.3+(100-t.ambition)*.18+(100-d)*.18+(me>15?12:0)],
  ["试探强者",t.courage*.18+t.caution*.18+t.ambition*.25+(d>60?18:0)+Math.random()*12],
  ["秘密结党",t.ambition*.34+(100-t.loyalty)*.28+t.caution*.18+(me<0?18:0)+(d>70?12:0)]
 ];
 options.sort((a,b)=>b[1]-a[1]);return options[0][0];
}
function relation(a,b){
 if(!a.links)a.links={}; return a.links[b.id]??0;
}
function changeRelation(a,b,delta){
 if(!a.links)a.links={};a.links[b.id]=Math.max(-100,Math.min(100,relation(a,b)+delta));
}
function chooseTarget(n){
 const candidates=npcs.filter(x=>x.id!==n.id);
 candidates.sort((a,b)=>Math.abs(relation(n,b))-Math.abs(relation(n,a)));
 return candidates[Math.floor(Math.random()*Math.min(4,candidates.length))];
}
function worldEvent(){
 const r=Math.random();
 if(r<.18){
  const n=npcs.filter(x=>x.id!=="zhao")[Math.floor(Math.random()*7)];
  n.trust=Math.max(0,n.trust-5);world.tension=Math.min(100,world.tension+6);
  n.memory=n.memory||[];n.memory.unshift("第"+turn+"回合遭遇流言");
  addLog("【流言】"+n.name+"听到有人在暗中议论自己。"+n.name+"开始重新评估身边的人。");
 }else if(r<.34){
  world.grain=Math.min(100,world.grain+5);
  addLog("【粮道】一批粮草抵达，暂时缓解了军中的压力。");
 }else if(r<.48){
  const a=npcs.filter(x=>x.id!=="zhao")[Math.floor(Math.random()*7)];
  const b=npcs.filter(x=>x.id!==a.id)[Math.floor(Math.random()*7)];
  changeRelation(a,b,Math.random()<.5?8:-8);
  addLog("【耳目】"+a.name+"与"+b.name+"之间出现了一次私下接触，外人不知道他们谈了什么。");
 }
}
function armyTurn(){
 armies.forEach(a=>{
  a.supply=Math.max(0,a.supply-Math.ceil(a.size/18));
  if(a.supply<25)a.morale=Math.max(0,a.morale-4);
  if(a.supply<12)a.size=Math.max(5,a.size-2);
  if(Math.random()<.16){
   const city=cities.find(x=>x.id===a.location);
   const next=city&&city.roads.length?city.roads[Math.floor(Math.random()*city.roads.length)]:null;
   if(next&&Math.random()<.55){a.location=next;addLog("【军队】"+a.name+"在"+city.name+"将部移动至"+cities.find(x=>x.id===next).name+"。");}
  }
 });
 cities.forEach(c=>{
  c.grain=Math.max(0,c.grain-2);
  if(c.grain<15)c.garrison=Math.max(5,c.garrison-1);
 });
}
function renderCities(){
 $("cities").innerHTML=cities.map(c=>`<div class="npc"><div class="npc-top"><strong>${c.name}</strong><span class="tag">${c.owner}</span></div><div class="tag">粮仓 ${c.grain} · 守军 ${c.garrison} · 主将 ${c.commander}</div><div class="meter"><i style="width:${Math.min(100,c.grain)}%"></i></div><div class="tag">道路：${c.roads.map(id=>cities.find(x=>x.id===id)?.name).join("、")}</div>${armies.filter(a=>a.location===c.id).map(a=>`<div class="tag">⚔ ${a.name}：${a.size}队 · 士气 ${a.morale} · 粮道 ${a.supply}</div>`).join("")}</div>`).join("");
}
function armyTurn(){
 Object.values(factions).forEach(f=>{
  const members=f.members.map(id=>npcs.find(n=>n.id===id)).filter(Boolean);
  if(!members.length)return;
  const avg=members.reduce((s,n)=>s+n.traits.ambition,0)/members.length;
  if(avg>68&&Math.random()<.45){f.power=Math.min(100,f.power+2);world.tension=Math.min(100,world.tension+2);addLog("【势力】"+f.name+"内部开始扩张影响力。");}
  if(world.grain<25&&Math.random()<.35){f.power=Math.max(0,f.power-3);addLog("【势力】"+f.name+"受到粮草压力，内部出现抱怨。");}
 });
 if(Math.random()<.18){
  const keys=Object.keys(factions),a=factions[keys[Math.floor(Math.random()*keys.length)]],b=factions[keys[Math.floor(Math.random()*keys.length)]];
  if(a!==b){a.power=Math.min(100,a.power+3);b.power=Math.max(0,b.power-2);world.tension=Math.min(100,world.tension+4);addLog("【派系冲突】"+a.name+"与"+b.name+"争夺军中话语权。");}
 }
}
function autonomous(){
 npcs.filter(n=>n.id!=="zhao").forEach(n=>{
  const action=score(n),target=chooseTarget(n);
  let text="";
  if(action==="扩张军权"){
   world.morale=Math.max(0,world.morale-2);world.tension=Math.min(100,world.tension+4);
   changeRelation(n,npcs.find(x=>x.id==="zhao"),-2);
   text=n.name+"调动亲信扩大军中影响力，"+target.name+"开始警惕。";
  }
  if(action==="暂时蛰伏"){
   world.tension=Math.max(0,world.tension-2);n.trust=Math.min(100,n.trust+1);
   text=n.name+"选择蛰伏，把资源藏起来观察别人先动。";
  }
  if(action==="谋求私利"){
   world.grain=Math.max(0,world.grain-2);n.trust=Math.max(0,n.trust-3);
   changeRelation(n,npcs.find(x=>x.id==="zhao"),-4);
   text=n.name+"暗中为自己争取利益，并刻意隐藏真实意图。";
  }
  if(action==="主动结盟"){
   changeRelation(n,target,10);changeRelation(target,n,6);world.prestige=Math.min(100,world.prestige+1);
   text=n.name+"主动接近"+target.name+"，提出结盟试探。";
  }
  if(action==="试探强者"){
   changeRelation(n,target,-3);n.memory=n.memory||[];n.memory.unshift("第"+turn+"回合试探了"+target.name);
   text=n.name+"派人试探"+target.name+"的底线，没有直接下注。";
  }
  n.memory=n.memory||[];n.memory.unshift("第"+turn+"回合："+action);n.memory=n.memory.slice(0,6);
  addLog(n.name+"【"+action+"】 → "+text);
 });
}
function addLog(text){logs.unshift({turn,text});renderLog()}
function saveGame(){
 localStorage.setItem("gameKingsSave",JSON.stringify({npcs,world,turn,day,logs,seed:Date.now()%999999}));
 addLog("【存档】乱世局势已经记录。");
}
function loadGame(){
 const raw=localStorage.getItem("gameKingsSave");if(!raw){addLog("【存档】尚未找到可恢复的局势。");return;}
 try{const s=JSON.parse(raw);Object.assign(world,s.world);turn=s.turn;day=s.day;logs.splice(0,logs.length,...s.logs);npcs.splice(0,npcs.length,...s.npcs);seed=s.seed||927;addLog("【存档】旧日局势重新浮现。");renderAll();}catch(e){addLog("【存档】存档损坏，已保留当前局势。");}
}
function nextTurn(){turn++;day++;autonomous();factionTurn();armyTurn();warTurn();politicalTurn();chainTurn();worldEvent();if(Math.random()<.35){world.tension=Math.min(100,world.tension+7);addLog("边地传来军情：新的传闻正在各势力之间流动。");}if(world.grain<20){world.morale=Math.max(0,world.morale-3);addLog("粮草告急，军中士气开始下降。");}if(world.tension>80){world.morale=Math.max(0,world.morale-2);addLog("天下紧张度过高，各方开始把最坏的可能当成真相。");}renderWorld();renderNpcs();renderDetail()}
function playerAction(a){
const n=npcs.find(x=>x.id===selected);if(!n)return;
if(a==="赏赐"){n.trust=Math.min(100,n.trust+12);world.grain=Math.max(0,world.grain-5);addLog("赵匡胤赏赐"+n.name+"，但对方究竟把这当成恩义，还是把它看成一次交易？");}
if(a==="试探"){addLog("赵匡胤试探"+n.name+"的态度。对方没有把真正的想法说出来。");world.tension=Math.min(100,world.tension+1);}
if(a==="拉拢"){n.trust=Math.min(100,n.trust+7);world.prestige=Math.min(100,world.prestige+2);addLog(n.name+"接受了赵匡胤的善意，但是否因此改变自己的长期目标，仍然未知。");}
if(a==="施压"){n.trust=Math.max(0,n.trust-15);world.tension=Math.min(100,world.tension+5);addLog("赵匡胤向"+n.name+"施压。对方表面低头，心中却记下了这笔账。");}
renderWorld();renderNpcs();renderDetail()}
function renderFactions(){
 $("factions").innerHTML=Object.values(factions).map(f=>`<div class="npc"><div class="npc-top"><strong>${f.name}</strong><span class="tag">势力值 ${f.power}</span></div><div class="meter"><i style="width:${f.power}%"></i></div><div class="tag">成员：${f.members.map(id=>npcs.find(n=>n.id===id)?.name).filter(Boolean).join("、")}</div></div>`).join("");
}
function renderWorld(){$("world").innerHTML=[["粮草",world.grain],["军心",world.morale],["威望",world.prestige],["天下紧张",world.tension]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}
function renderNpcs(){$("npcs").innerHTML=npcs.map(n=>`<div class="npc ${selected===n.id?"active":""}" onclick="selected='${n.id}';renderNpcs();renderDetail()"><div class="npc-top"><strong>${n.name}</strong><span class="tag">${n.faction} · ${n.role}</span></div><div class="tag">${n.personality}</div><div class="meter"><i style="width:${n.trust}%"></i></div></div>`).join("")}
function renderLog(){$("log").innerHTML=logs.map(l=>`<div class="event"><div class="turn">第 ${l.turn} 回合</div><p>${l.text}</p></div>`).join("")}
function renderAll(){renderWorld();renderFactions();renderCities();renderBattles();renderCrisis();renderChains();renderNpcs();renderLog();renderDetail();}
function renderDetail(){let n=npcs.find(x=>x.id===selected);$("detail").innerHTML=`<div class="big">${n.name}</div><div class="tag">${n.faction} · ${n.role}</div><div class="quote">“${n.quote}”</div><p><b>性格：</b>${n.personality}</p><p><b>当前目标：</b>${n.goal}</p><p><b>对你的信任：</b>${n.trust}/100</p><p><b>最近记忆：</b>${n.memory&&n.memory.length?n.memory[0]:"暂无"}</p><div class="stats">${Object.entries(n.traits).map(([k,v])=>`<div class="stat"><b>${v}</b><span>${({ambition:"野心",loyalty:"忠诚",greed:"贪欲",courage:"勇气",caution:"谨慎"})[k]}</span></div>`).join("")}</div><div class="actions"><button onclick="playerAction('赏赐')">赏赐</button><button onclick="playerAction('试探')">试探</button><button onclick="playerAction('拉拢')">拉拢</button><button onclick="playerAction('施压')">施压</button></div>`}
addLog("天下风雨未定。赵匡胤开始观察身边每一个人的选择。");renderAll();
</script>
</body></html>
